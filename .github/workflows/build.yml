name: Build Flet APK
on:
  push:             # Building starts automatically when you save/push
  workflow_dispatch: # Keeps the manual button there just in case

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: |
          pip install flet
          # If you have a requirements.txt, this installs it too
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Android APK
        run: |
          # The --yes flag bypasses prompts so the robot doesn't get stuck
          flet build apk --project "AspirantFlow" --release --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AspirantFlow-App
          path: build/apk/*.apk
