name: Build Flet APK
on:
  workflow_dispatch: # This lets you start the build manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Android APK
        run: |
          # We use the --release flag to make the app faster and smaller
          flet build apk --project "AspirantFlow" --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AspirantFlow-Android-App
          path: build/apk/*.apk
